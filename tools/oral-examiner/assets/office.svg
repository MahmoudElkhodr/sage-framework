<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" preserveAspectRatio="xMidYMid slice">
  <!-- Stylised academic office, drawn for SAGE Defend Practice (CC BY 4.0). Shown blurred behind the examiner. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9dc"/><stop offset="1" stop-color="#e2dac8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2ea"/><stop offset="0.65" stop-color="#e8f0ea"/><stop offset="1" stop-color="#b9cfb0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3cf" stop-opacity="0.9"/><stop offset="1" stop-color="#fff3cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b79f80"/><stop offset="1" stop-color="#9c8467"/>
    </linearGradient>
  </defs>

  <rect width="800" height="680" fill="url(#wall)"/>

  <!-- Window with trees outside -->
  <g transform="translate(470 70)">
    <rect width="290" height="330" rx="6" fill="#d9d2c2"/>
    <rect x="14" y="14" width="262" height="302" fill="url(#sky)"/>
    <ellipse cx="80" cy="270" rx="90" ry="60" fill="#8fb08a"/>
    <ellipse cx="200" cy="285" rx="110" ry="55" fill="#7ea37c"/>
    <ellipse cx="140" cy="250" rx="60" ry="45" fill="#a3c19b"/>
    <rect x="141" y="14" width="8" height="302" fill="#d9d2c2"/>
    <rect x="14" y="160" width="262" height="8" fill="#d9d2c2"/>
    <rect x="-10" y="316" width="310" height="16" rx="3" fill="#cfc6b3"/>
  </g>

  <!-- Bookshelf -->
  <g transform="translate(40 60)">
    <rect width="300" height="460" rx="4" fill="#8a6a4c"/>
    <rect x="12" y="12" width="276" height="436" fill="#6f533a"/>
    <g fill="#8a6a4c"><rect x="12" y="118" width="276" height="10"/><rect x="12" y="228" width="276" height="10"/><rect x="12" y="338" width="276" height="10"/></g>
    <!-- books, shelf 1 -->
    <g>
      <rect x="22" y="40" width="22" height="78" fill="#173f32"/><rect x="46" y="52" width="18" height="66" fill="#b6a35e"/>
      <rect x="66" y="34" width="26" height="84" fill="#37694e"/><rect x="94" y="46" width="16" height="72" fill="#e9eee3"/>
      <rect x="112" y="40" width="24" height="78" fill="#9b3b2f"/><rect x="160" y="60" width="70" height="20" fill="#dce7cc"/>
      <rect x="160" y="82" width="70" height="36" fill="#5e6b60"/><circle cx="262" cy="98" r="18" fill="#b6a35e"/>
    </g>
    <!-- shelf 2 -->
    <g>
      <rect x="22" y="150" width="20" height="78" fill="#d9c9a3"/><rect x="44" y="140" width="28" height="88" fill="#103427"/>
      <rect x="74" y="156" width="18" height="72" fill="#7a8f7c"/><rect x="94" y="146" width="22" height="82" fill="#c7b37a"/>
      <rect x="118" y="160" width="16" height="68" fill="#37694e"/><rect x="136" y="150" width="24" height="78" fill="#e2dac8"/>
      <path d="M190 228 q30 -70 60 0 z" fill="#6b8f65"/><rect x="200" y="200" width="40" height="28" rx="4" fill="#c9b79a"/>
    </g>
    <!-- shelf 3 -->
    <g>
      <rect x="22" y="262" width="110" height="20" fill="#e9eee3"/><rect x="22" y="284" width="110" height="18" fill="#173f32"/>
      <rect x="22" y="304" width="110" height="34" fill="#b6a35e"/>
      <rect x="150" y="252" width="22" height="86" fill="#9b3b2f"/><rect x="174" y="262" width="18" height="76" fill="#5e6b60"/>
      <rect x="194" y="256" width="26" height="82" fill="#37694e"/><rect x="222" y="266" width="20" height="72" fill="#d9c9a3"/>
      <rect x="244" y="250" width="30" height="88" fill="#103427"/>
    </g>
    <!-- shelf 4 -->
    <g>
      <rect x="30" y="372" width="90" height="66" rx="4" fill="#cdbf9f"/><rect x="140" y="360" width="20" height="78" fill="#37694e"/>
      <rect x="162" y="370" width="24" height="68" fill="#b6a35e"/><rect x="188" y="364" width="18" height="74" fill="#e9eee3"/>
      <rect x="208" y="358" width="26" height="80" fill="#173f32"/>
    </g>
  </g>

  <!-- Framed certificate and lamp glow -->
  <rect x="370" y="110" width="74" height="96" rx="3" fill="#b6a35e"/>
  <rect x="377" y="117" width="60" height="82" fill="#f7f5ee"/>
  <circle cx="420" cy="420" r="120" fill="url(#lamp)"/>

  <!-- Tall plant -->
  <g transform="translate(700 380)">
    <rect x="-28" y="150" width="56" height="70" rx="8" fill="#cdbf9f"/>
    <path d="M0 150 C-60 80 -70 20 -30 -40 C-20 30 -10 80 0 150" fill="#5f8a5c"/>
    <path d="M0 150 C50 70 70 0 40 -60 C25 20 15 80 0 150" fill="#6f9c69"/>
    <path d="M0 150 C-10 60 0 -10 10 -80 C20 0 15 80 0 150" fill="#4f7a4d"/>
  </g>

  <!-- Floor and desk edge -->
  <rect y="600" width="800" height="80" fill="url(#floor)"/>
  <rect y="560" width="800" height="40" fill="#c9b79a"/>
  <rect y="556" width="800" height="8" fill="#b9a586"/>
</svg>
